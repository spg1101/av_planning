# F1TENTH car (hardware target, and the kinematic sim). Shared by planning AND controls.
vehicle:
  wheelbase: 0.3302          # m (standard F1TENTH chassis)
  max_steer: 0.4189          # rad (24 deg)
  max_speed: 3.0             # m/s, start conservative; raise after testing
  max_accel: 3.0             # m/s^2
  max_decel: 4.0             # m/s^2
  max_lateral_accel: 4.0     # m/s^2, traction/comfort limit
  width: 0.31                # m
  length: 0.58               # m
