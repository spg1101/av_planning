# robot_localization EKF in the odom frame: publishes odom -> base_link and /odometry/filtered.
# Config vectors are [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az].
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: forward speed and yaw rate only (never fuse its integrated pose).
    odom0: /vehicle/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # IMU: yaw rate and forward acceleration.
    imu0: /sensors/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    # TODO(member A): GNSS. Add navsat_transform_node + a second EKF (world_frame: map) fusing
    # /sensors/gnss, as an alternative to SLAM for the map -> odom correction. Note: CARLA GNSS
    # is relative to each town's geo-reference, so set the navsat datum from that.

    # Start pose: the CARLA adapter publishes the true start pose on /set_pose before the first
    # tick, so the odom frame starts aligned with CARLA's world frame (no initial_state needed).
